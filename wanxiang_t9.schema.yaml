# Rime schema
# encoding: utf-8
schema:
  schema_id: wanxiang_t9
  name: 万象九键
  version: "LTS"
  author:
    - amzxyz
  description: |
    万象拼音九宫格公共方案
  dependencies:

# 开关
# reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
# states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
# abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
switches:
  - name: ascii_mode  # 中英输入状态
    states: [中文, 英文]
  - name: ascii_punct  # 中英标点，可以在中文输入状态输入英文符号
    states: [中标, 英标]
  - name: full_shape  #全角、半角字符输出
    states: [半角, 全角]
  - name: emoji  #候选出现emoji滤镜，会显示在相应的候选后面，万象侧重于tips提示，避免候选被占用，因此默认为reset: 0，归属opencc emoji滤镜
    states: [表情关, 表情开]
  - name: chinese_english  #候选进入翻译模式滤镜，会显示在相应的候选后面，万象侧重于tips提示，避免候选被占用，归属opencc 翻译滤镜
    states: [翻译关, 翻译开]
  - name: charset_filter  #字符集过滤，默认开启8105通规显示，即小字集，可通过开关实时开启全字集，快捷键配套ctrl+g,归属：super_filter.lua
    states: [大字集, 小字集]
    reset: 0
  - name: context_reorder
    states: [上下文关, 上下文开]  # 上下文调频
  - name: full_pinyin  # T9/T9i：原编码 / 转全拼
    states: [原编码, 转全拼]
    reset: 1
  - options: [s2s, s2t, s2hk, s2tw]  # 简繁转换开关组，可以在一个空选项和多个实际“- simplifier@s2hk”引入的项目之前切换，这是一个开关组，你可以将其中任意一个s2s等设置为toggle快捷键，多次按下将轮询
    states: [简体, 通繁, 港繁, 臺繁]
  - name: toneless_hint  # T9/T9i：注释关 / 注释开
    states: [注释关, 注释开]
    reset: 0  #固定为无声调输出，其他前端用户可以适当patch修改
  - name: super_tips  #开启后在输入编码后面的提示区显示实时的提示数据，受tips数据库影响，表情、翻译、车牌、符号等对应关系数据，并可实现句号上屏，不开启则默认，影响的是segment.prompt参数，归属：super_tips.lua
    states: [提示关, 提示开]
    reset: 1
  - name: abbrev
    states: [简码关, 简码开]
    reset: 1

# 输入引擎
engine:
  processors:
    - lua_processor@*wanxiang.context_reorder*P  #靠自己养的专属上下文调频工具
    - lua_processor@*wanxiang.super_processor  #KP小键盘、字母选词、符号快打、超强分词、重复限制、退格限制、声调回退、以词定字
    - lua_processor@*wanxiang.super_tips  #超级提示模块：表情、简码、翻译、化学式、等等靠你想象
    - ascii_composer  #处理英文模式及中英文切换
    - recognizer  #与 matcher 搭配，处理符合特定规则的输入码，如网址、反查等 tags
    - key_binder  #在特定条件下将按键绑定到其他按键，如重定义逗号、句号为候选翻页、开关快捷键等
    - lua_processor@*wanxiang.key_binder  #绑定按键扩展能力，支持正则扩展将按键生效情景更加细化
    - speller  #拼写处理器，接受字符按键，编辑输入
    - punctuator  #符号处理器，将单个字符按键直接映射为标点符号或文字
    - selector  #选字处理器，处理数字选字键〔可以换成别的哦〕、上、下候选定位、换页
    - navigator  #处理输入栏内的光标移动
    - express_editor  #编辑器，处理空格、回车上屏、回退键
  segmentors:
    - ascii_segmentor  #标识英文段落〔譬如在英文模式下〕字母直接上屛
    - matcher  #配合 recognizer 标识符合特定规则的段落，如网址、反查等，加上特定 tag
    - abc_segmentor  #标识常规的文字段落，加上 abc 这个 tag
    - affix_segmentor@wanxiang_reverse  #反查 tag
    - punct_segmentor  #标识符号段落〔键入标点符号用〕加上 punct 这个 tag
    - fallback_segmentor  #标识其他未标识段落，必须放在最后帮助tag模式切换后回退重新处理
  translators:
    - punct_translator  #配合 punct_segmentor 转换标点符号
    - script_translator  #脚本翻译器，用于拼音、粤拼等基于音节表的输入方案
    - lua_translator@*wanxiang.version_display  #输入'/wx'，显示万象项目网址和当前版本号
    - lua_translator@*wanxiang.shijian  #农历、日期、节气、节日、时间、周、问候模板等等，触发清单看下文
    - lua_translator@*wanxiang.super_calculator  #超级计算器，Lua内查看高级用法
    - lua_translator@*wanxiang.input_statistics  #一个输入统计的脚本，以日、周、月、年等维度的统计
    - lua_translator@*wanxiang.number_conversion  #数字、金额大写，通过输入大写R1234获得候选输出
    - reverse_lookup_translator@wanxiang_reverse  #挂接部件组字和笔画反查
  filters:
    - lua_filter@*wanxiang.super_lookup  #字词输入中反查辅助筛选
    - lua_filter@*wanxiang.context_reorder*F  #用于输入编码后的上下文调频
    - lua_filter@*wanxiang.super_comment_preedit  #超级注释模块、超级preedit，支持错词提示、辅助码显示，部件组字读音注释，有声调、无声调全拼编码的转换，支持个性化配置和关闭相应的功能，详情搜索super_comment_preedit进行详细配置
    - lua_filter@*wanxiang.super_replacer  #OpenCC替代器，更灵活的处理方式，更自由的自定义方式，支持简繁转换、简码模式、支持候选替换、注释替换、候选派生等等
    - lua_filter@*wanxiang.super_filter  #replacer后面，先进行转换后过滤，这样能繁体继承简体权重。本质功能相关功能见Lua文件
    - uniquifier  # 去重

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

# 主翻译器，拼音
translator:
  dictionary: wanxiang_lite  # 挂载主词库
  #  packs: user                  #导入根目录下名称为user.dict.yaml的自定义固定词典
  prism: wanxiang_t9  # 多方案共用一个词库时，为避免冲突，需要用 prism 指定一个名字。
  enable_completion: true  # 启用候选词补全
  #  user_dict: zrm.userdb       # 用户词典的文件名称
  #  db_class: tabledb           #开启后就不会产生wanxiang.userdb这样的文件夹，会直接输出文本wanxiang.txt同时无法使用同步能力，可设 tabledb〔文本〕或 userdb〔二进制〕
  enable_user_dict: true  # 是否开启自动调频，即开启用户词典
  enable_sentence: false  #是否开启自动造句
  enable_correction: false  #是否开启自动纠错
  encode_commit_history: true  # 预留历史上屏自动编码成词
  contextual_suggestions: false  #模型预测，假设模型里面有的四个字的词汇 现在智能 而首选组合 现在只能 当你输入 现在 上屏后下一次输入zhi neng就会输出，智能前提是没有权重更高的了，很明显这与你的预期“现在只能”不符。很明显实际上又要预测又要连续句子，放一起是很难优雅的。
  max_homophones: 8
  core_word_length: 4  # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7  # >0 启用，过长短语不记整词，只加元素权重
  initial_quality: 3  #初始质量拼音的权重应该比英文大
  spelling_hints: 50  #将注释以词典code字符串形式完全暴露，通过super_comment.lua完全接管，灵活配置。
  always_show_comments: true  # Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供super_comment.lua做判断用。
  comment_format:
    - xform/;[a-z]{2}(,[a-z]{2})*//
  #disable_user_dict_for_patterns:  #如果你开启调频，需要一并考虑这个配置是否需要，基本的6码3字不调频，你可以自定义，目前的逻辑是依然记录用户词但满足规则的不输出不被使用
  #  - "^[a-z]{1,6}"

wanxiang_lookup:  #设置归属于super_lookup.lua
  tags: [abc]  # 检索当前tag的候选
  key: "`"  # 输入中反查引导符，要添加到 speller/alphabet
  lookup: [wanxiang_reverse]  #反查滤镜数据库，万象都合并为一个了
  data_source: [db]  #对于pro版本能从注释中加载词库辅助码，详情见Pro版本，base这里无需修改。

# 拼写设定
speller:
  # table_translator翻译器，支持自动上屏。例如 “zmhu”可以自动上屏“怎么回事”
  #  auto_select: true
  #  auto_select_pattern: ^[a-z]+/|^[a-df-zA-DF-Z]\w{3}|^e\w{4}
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射，alphabet就是将字符纳入输入编码的范畴
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210`/\
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210/
  delimiter: " '"  # 系统配置，第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  algebra:
    - xform/ⅱ//  #用于Lua判断输入类型的标记
    - xform/^(.*);.*$/$1/
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ/aaaaooooeeeeiiiiuuuuvvvvvnnn/
    - xform/ḿ/me/
    - xform/m̀/me/
    - derive/^ng$/eng/
    - xform/^n$/en/
    #- abbrev/^([a-z]).*/$1/
    - derive/^(.*)$/\U$1/
    #- abbrev/^([A-Z]).*/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([NL])VE$/$1UE/
    - derive/ong$/on/
    - derive/iong$/ion/
    - derive/ONG$/ON/
    - derive/IONG$/ION/
    - derive/^([jqxy])u/$1v/
    - derive/^([JQXY])U/$1V/
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/22233344455566677778889999/

# 处理符合特定规则的输入码，如网址、反查
recognizer:
  import_preset: default  # 从 default.yaml 继承通用的
  patterns:  # 再增加方案专有的：
    punct: "^/(?!/)(?:[A-Za-z]+|[!-/:-@\\[-`{-~][!-/:-~]?[A-Za-z]?|[A-Za-z][!-\\+/:-<>-@\\\\\\^-`{-~][A-Za-z]?|[ADEIKLOTUadeilotu]-[A-Za-z]?|[CEHLNPRTWYc-ehpry]=[A-Za-z]?|[AC-EG-IKLNOR-Ua-eg-iklnor-u],[A-Za-z]?|[B-GIMPS-UZb-gimpstz]\\.[A-Za-z]?|\\([)A-Za-z]\\)|--[-.]|\\\\o/|[0-9]|0[3*~]|1(?:[0-9^]|10)|2[35^]|3[458^]|45|5[68]|78|88|\\*0|<3|\\^[0-9]|_[0-9]|~0|\\((?:[0-9]|[1-4][0-9]|50)\\)?)$"
    wanxiang_reverse: "^`[A-Za-z;]*$"  # 响应部件拆字与笔画的反查，与 wanxiang_reverse/prefix 匹配
    #add_user_dict: "^ac[A-Za-z/`']*$"   #引导式造词
    unicode: "^U[a-f0-9]+"  # U 作为触发前缀，响应 lua_translator@unicode，输出 Unicode 字符
    number: "^R(-|-?[0-9]+[.:]?[0-9]*)$"  # R 作为触发前缀, 响应 lua_translator@number_conversion，数字金额大写
    yr1: "^N0[1-9]?0?[1-9]?"
    yr2: "^N1[02]?0?[1-9]?"
    yr3: "^N0[1-9]?[1-2]?[1-9]?"
    yr4: "^N1[02]?[1-2]?[1-9]?"
    yr5: "^N0[1-9]?3?[01]?"
    yr6: "^N1[02]?3?[01]?"
    nyr1: "^N19?[0-9]?[0-9]?[0-9]?[0-9]?[0-9]?[0-9]?"
    nyr2: "^N20?[0-9]?[0-9]?[0-9]?[0-9]?[0-9]?[0-9]?"
    nyr_diff: "^N(19|20)[0-9]{6}-[0-9]{0,8}$"
    calculator: "^V.*$"  # V 作为触发前缀，计算器功能引导
    #add_user_dict: "^ac[A-Za-z/`']*$"      #自造词引导方式
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"  # email @ 之后不上屏
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"  # URL

punctuator:
  digit_separators: ",."  #数字分隔符，系统逻辑是在中文状态下输入数字后继续输入句号按下两次即输入半角状态
  __include: wanxiang_symbols:/symbol_table         # 从 wanxiang_symbols.yaml 导入所有符号配置
  __patch:
    - wanxiang_symbols:/symbols
    - t9_sym
t9_sym:
  half_shape/+:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
    "@": [1, "@", ！, ：, 、, ……, ～]
    "#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]
# 从 default 继承快捷键
key_binder:
  import_preset: default  # 从 default.yaml 继承通用的
  # Lua 配置: shijian.lua 的引导符，涉及：日期、时间、节日、节气、生日、问候模板等功能
  shijian_keys: ["/", "6"]
  bindings:  # 也可以再增加方案专有的
    - {when: has_menu, accept: 1, send: apostrophe}
    #当tab第一个字补码正确后，可以使用Ctrl+tab进行上屏并依次补码
    - {when: composing, accept: "Control+Tab", send_sequence: '{Home}{Shift+Right}{1}{Shift+Right}'}
    - {match: "^.*`$", accept: "`", send_sequence: '{BackSpace}{Home}{`}{`}{End}'}
    - {when: composing, accept: Return, send: "Shift+Return",}  #t9没有上屏数字的必要，但preedit有可能


super_comment:  # 超级注释模块，子项配置 true 开启，false 关闭
  candidate_length: 15  # 候选词辅助码提醒的生效长度，0为关闭  但同时清空其它，应当使用上面开关来处理
  corrector_type: "comment"  # 注意9键里应原状态输出，不要加括号。随意更换左右括号，比如"〔comment〕" 不加括号为无括号，comment占位不能动
  tone_isolate: true  # 是否将数字声调从转换后拼音中隔离出来（true=隔离， false 直接参与转换）例如：nǐ3
  convert_abbrev_preedit: false  #单音节简码是否转换为全拼读音
  cand_type:

super_processor:
  enable_backspace_limit: false  # 开启/关闭退格限制，九键莫动
  enable_seg_loop: false  # 开启/关闭分词符（'）循环，九键莫动
  enable_tone_fallback: false  # 启用声调回退，九键莫动
  enable_predict_space: true  # 启用联想空格打断，直接上屏空格并清空联想，对齐大厂
  kp_number_mode: auto  # 小键盘模式 (auto / compose / select)，九键莫动
  limit_repeated: "8,40"  #格式："最大重复声母数,最大候选字数"
  select_character: "[,]"  # 开启以词定字，自动拆解第一位上屏首字，第二位上屏尾字
  # 下面这些写法都支持：
  # select_character: "[,]"                      # [ 上屏首字，] 上屏尾字（推荐）
  # select_character: "bracketleft, bracketright"  # [ 上屏首字，] 上屏尾字（英文全拼）

context_reorder:
  db_name: context_reorder
  enable_fallback_reorder: false
  context_timeout: 5000
  custom_classifiers:
    - 个只名位口人头匹条群批伙多
    - 张把件台部块根颗粒滴片朵面扇顶栋座所辆艘架盏支枝杆
    - 双对副套打串束排阵堆叠摞扎
    - 杯瓶盒包份碗锅盆桶袋罐盘
    - 次场局回趟顿番遍声项宗桩款步招
    - 年月天周岁秒分刻代期届任夜季
    - 本册篇首句段卷幅节堂门帖字行
    - 米寸尺里斤两吨克升元角毛笔百千万亿

# 字符集过滤lua
# a,通用规范汉字表
# b,GB2312,
# g,GBK,
# T,Big5,(台港澳常用)
# j,简体,OpenCC (t2s)
# f,通用繁体,OpenCC (s2t)
# h,香港繁体, OpenCC (s2hk)
# t,台湾繁体, OpenCC (s2tw)
# u,基本区,U+4E00 - U+9FFF
# A-I,扩展 A-I 区,U+3400 及各扩展区 (支持到 Ext-I)
# c,兼容区汉字
# 你可以通过黑白名单微调你自己每个开关下面的字符集过滤清单，主数据库位于lua/charset.reverse.bin不可编辑
# 你可以按上面提到的规则代号在base处填写上基础集，还可以在每一个开关的开白名单设置微调数据，就像默认添加的字符集过滤在8105基础上新增了一些
# 你可以定义多个开关，多个开启状态的开关求并集，比如charset_filter开着，s2hk也开着，那么就会显示这两个集合的所有汉字
# 优雅的地方在于s2hk开着，charset_filter关着 我们照样能使用 港繁能用到的所有字，是真正的本体，无关字会被过滤，而当都开着则是享受简体转换成繁体的后的结果
# 这个设计真正的兼容了简繁转换与字符集过滤的矛盾，还能满足用户多种自定义需求，你可以在开关增加类别，并在charset下面新增option类去选择按照字区去过滤，等多种组合方式
charset_filter:
  - option: charset_filter
    base: a
    addlist:
      - "诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲"
    blacklist: []
  - option: s2t
    base: fa
    addlist: []
    blacklist: []
  - option: s2hk
    base: ha
    addlist: []
    blacklist: []
  - option: s2tw
    base: ta
    addlist: []
    blacklist: []

super_tips:
  tips_key: "comma"  # key英文单词不清楚去default找
  files:  # 自定义数据文件列表（可选，不配置则使用默认文件）
    - lua/data/tips_show.txt  # 仍可保留默认文件
    #- lua/data/my_tips.txt     # 用户自定义文件
  disabled_types:
    - "禁用类型A"
    - "禁用类型B"
    # 禁用的 tips 类型，初始化 tips 数据库的时候会直接忽略相关规则，修改部署后生效
    # 可选项为：偏旁，符号，化学式，时间，符号，组字，翻译，表情，货币，车牌, 单位

#shijian:仅支持修改前缀，为了固定习惯，后两码写死，如有需求lua中修改
#时间：osj 或者 /sj
#日期：orq 或者 /rq
#农历：onl 或者 /nl
#星期：oxq 或者 /xq
#今年第几周：oww 或者 /ww
#节气：ojq 或者 /jq
#日期+时间：odt 或者 /dt
#时间戳：ott 或者 /tt
#大写N日期：N20250315 或者N0312不带年
#节日：ojr 或者 /jr
#问候模板：/day 或者 oday
# 通用日期时间格式化函数（供 /rq、/sj、/dt、N0101、N20150101 场景复用）
# 支持转义：
#   \X       —— 转义单个字符 X，按字面量输出（如 \Y \m \H 等）
#   [[...]]  —— 区块整体按字面量输出
#
# 约定占位符：
# 【日期】
#   Y  四位年份           0000-9999  例：2025
#   y  两位年份           00-99      例：25
#   m  月（前导零）        01-12      例：02
#   n  月（不带前导零）     1-12       例：2
#   d  日（前导零）        01-31      例：09
#   j  日（不带前导零）     1-31       例：9
#   B  月（英文完整单词）    August
#   b  月（英文单词前缀）    Aug
#
# 【时间】
#   H  24小时（前导零）   00-23      例：08
#   G  24小时（不带零）   0-23       例：8
#   I  12小时（前导零）   01-12      例：08
#   l  12小时（不带零）   1-12       例：8   （注意是小写 L）
#   M  分钟（前导零）     00-59      例：05
#   S  秒（前导零）       00-59      例：09
#   p  am/pm（小写）     am / pm
#   P  AM/PM（大写）     AM / PM
# 【时区】
#   O  带冒号格式        +08:00、-04:30、+05:45
#   o  不带冒号格式      +0800、-0430、+0545
#   A  中文时段    凌晨 / 上午 / 中午 / 下午 / 晚上
# 【星期】
#   w  年第几周     01
#   E  英文星期全称  Sunday
#   F  英文星期简称  Sun
#   C  中文星期全称  星期一
#   D  中文星期简称  周一
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - "Y.m.d"
  - "Ymd"
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"
time_formats:
  - "H:M"
  - "H点M分"
  - "H:M:S"
  - "H时M分S秒"
  - "AI:M"
  - "I:M P"
datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - "YmdHMS"
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"
english_date_formats:
  - "B j, Y"
  - "j b Y"
  - "Y-m-d"

input_stats:
  db_name: "stats"  # 自定义统计数据库路径
  triggers:
    local_total: "/btj"  # 查设备生涯统计
    today: "/rtj"  # 查今日（日统计）
    week: "/ztj"  # 查本周（周统计）
    month: "/ytj"  # 查本月（月统计）
    year: "/ntj"  # 查本年（年统计）
    total: "/tj"  # 查生涯（总统计）
    history: "/htj"  # 时光机：查历史。用法示例输入：/htj20231015，从年月日依次递进，以t间隔查区间/htj20231015t20240102

# 如果你不配 titles，默认会使用内置的“打字流派”段位。
# 如果你想魔改（比如修真流），就取消下面这段注释：
#  titles:  #对齐：triggers
#    - "0:初入道途·炼气期"
#    - "10000:小有所成·筑基期"
#    - "50000:凝真化虚·金丹期"
#    - "100000:破茧成蝶·元婴期"
#    - "500000:掌控法则·化神期"
#    - "1000000:破碎虚空·渡劫期"


super_replacer:
  comment_format: "〔%s〕"
  chain: true  #true表示流水线作业，上一个option产出交给下一个处理，典型的s2t>t2hk=s2hk，false就是并行，直接用text转换
  rules:
    # 场景1：输入 '哈哈' -> 变成 '1.哈哈 2.😄'
    - option: emoji  # 开关名称与上面开关名称保持一致
      mode: append  # 新增候选append 替换原候选replace 替换注释comment 简码模式abbrev匹配输入编码置顶词组
      comment_mode: none  # 注释模式: "append"(原候选注释继承), "text"(原候选文本放在注释), "none"(空，默认)
      tags: [abc]  # 生效的tag
      prefix: "_em_"  # 前缀用于区分同一个数据库的不同用途数据
      files:
        - lua/data/emoji.txt
    # 场景2：输入 'hello' -> 显示 'hello 〔你好 | 哈喽〕'
    - option: chinese_english
      mode: append  # <--- 添加注释模式
      comment_mode: none
      tags: [abc]
      prefix: "_en_"
      files:
        - lua/data/english_chinese.txt
        - lua/data/chinese_english.txt
    # 场景3：用于常驻的直接替换 option: true
    - option: true
      mode: append  # <--- 新增候选模式
      comment_mode: none
      tags: [abc]
      prefix: "_ot_"
      files:
        - lua/data/others.txt
    # 场景4：用于简繁转换的直接替换
    - option: [s2t, s2hk, s2tw]  #后面依赖这条流水线有一个开关为true这条流水线就能工作
      mode: replace  # <--- 替换原候选模式
      comment_mode: append
      sentence: true  # <--- 句子级别替换
      tags: [abc]
      prefix: "_s2t_"
      files:
        - lua/data/STCharacters.txt
        - lua/data/STPhrases.txt
    - option: s2hk
      mode: replace  # <--- 替换原候选模式
      comment_mode: append
      sentence: true  # <--- 句子级别替换
      tags: [abc]
      prefix: "_s2hk_"
      files:
        - lua/data/HKVariants.txt
    - option: s2tw
      mode: replace  # <--- 替换原候选模式
      comment_mode: append
      sentence: true  # <--- 句子级别替换
      tags: [abc]
      prefix: "_s2tw_"
      files:
        - lua/data/TWVariants.txt
    - option: abbrev
      mode: abbrev  # <--- 新增的简码模式
      tags: [abc]
      abbrev_rule: "2,3"
      # 前置数量2，前置位置3,数量说的是你维护得数据库编码后面分割了几个词前几个要前置显示,位置说的是你要前置到第二候选还是第几
      # 然后空码或只有英文等自定义词组的时候直接全部兜底显示,这个新的设计简化的应用层面,我们只需要维护一个数据库即可.
      t9_optimization: true  #t9优化,从txt里编码转换为实际打字需要的编码，例如九键维护用字母加载数据库变数字,源编码
      prefix: "_abr_"
      files:
        - lua/data/t9_abbrev.txt  # 格式：打开文件看
        #- lua/data/t9_custom.txt #你可以这样patch一个新的文本代替根目录custom_phrase.txt，九键就有了自己的自定义词典
